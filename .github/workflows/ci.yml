name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: moncompagnon
          POSTGRES_PASSWORD: moncompagnon
          POSTGRES_DB: moncompagnon_test
        ports: ['5443:5432']
        options: >-
          --health-cmd "pg_isready -U moncompagnon"
          --health-interval 2s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql://moncompagnon:moncompagnon@localhost:5443/moncompagnon_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:e2e
